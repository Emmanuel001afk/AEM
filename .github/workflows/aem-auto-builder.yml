name: AEM Automatic GitHub Builder

concurrency:
  group: aem-build-queue
  cancel-in-progress: false

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
jobs:
  build-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Claim queued build
        id: claim
        shell: bash
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rows="$(curl -fsS "$SUPABASE_URL/rest/v1/build_requests?select=*&status=eq.queued&order=created_at.asc&limit=1" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")"
          if [ "$(jq 'length' <<<"$rows")" = "0" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          id="$(jq -r '.[0].id' <<<"$rows")"
          repo="$(jq -r '.[0].repository' <<<"$rows")"
          ref="$(jq -r '.[0].ref' <<<"$rows")"
          module="$(jq -r '.[0].module // empty' <<<"$rows")"
          variant="$(jq -r '.[0].variant // "debug"' <<<"$rows")"
          channel="$(jq -r '.[0].channel // "development"' <<<"$rows")"
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/build_requests?id=eq.$id" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" --data "{\"status\":\"running\",\"workflow_run_id\":$RUN_ID,\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Checkout requested repository
        if: steps.claim.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.claim.outputs.repo }}
          ref: ${{ steps.claim.outputs.ref }}
          path: source
          token: ${{ secrets.APK_STORE_TOKEN }}
      - name: Set up Node
        if: steps.claim.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        if: steps.claim.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        if: steps.claim.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        if: steps.claim.outputs.found == 'true'
        id: build
        working-directory: source
        env:
          MODULE: ${{ steps.claim.outputs.module }}
          VARIANT: ${{ steps.claim.outputs.variant }}
        run: |
          set -euo pipefail
          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            npm install
            if [ -f "vite.mobile.config.ts" ]; then
              npx vite build --config vite.mobile.config.ts
            else
              npm run build
            fi
            npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
            npx --yes @capacitor/cli@7 add android
            if [ -f "native/MainActivity.java" ] && [ -f "native/AemInstallerPlugin.java" ]; then
              mkdir -p android/app/src/main/java/com/aem/store
              cp native/MainActivity.java android/app/src/main/java/com/aem/store/MainActivity.java
              cp native/AemInstallerPlugin.java android/app/src/main/java/com/aem/store/AemInstallerPlugin.java
              cp native/InstallResultReceiver.java android/app/src/main/java/com/aem/store/InstallResultReceiver.java
              python3 native/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
            fi
            npx --yes @capacitor/cli@7 copy android
            (cd android && ./gradlew assembleDebug)
            apk="$(find android -type f -path "*/build/outputs/apk/*.apk" | head -n 1)"
          else
            v="$(tr '[:lower:]' '[:upper:]' <<<"${VARIANT:0:1}")${VARIANT:1}"
            if [ -n "$MODULE" ]; then task=":$MODULE:assemble$v"; else task="assemble$v"; fi
            if [ -x "./gradlew" ]; then ./gradlew "$task"; else gradle "$task"; fi
            apk="$(find . -type f -path "*/build/outputs/apk/*.apk" | head -n 1)"
          fi
          test -n "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload built APK as workflow artifact
        if: steps.claim.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aem-built-apk
          path: source/${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 1

      - name: Publish APK to AEM catalog
        if: steps.claim.outputs.found == 'true'
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          GH_TOKEN: ${{ secrets.APK_STORE_TOKEN }}
          REQUEST_ID: ${{ steps.claim.outputs.id }}
          REPO: ${{ steps.claim.outputs.repo }}
          CHANNEL: ${{ steps.claim.outputs.channel }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          APK="source/${{ steps.build.outputs.apk }}"
          badging="$("$AAPT" dump badging "$APK" | head -n 1)"
          package="$(sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          test -n "$package"
          test -n "$version_name"
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/aem-publish-github-artifact" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "x-github-token: $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc \
              --arg repo "$REPO" \
              --arg request_id "$REQUEST_ID" \
              --argjson run_id "$RUN_ID" \
              --arg artifact_name "aem-built-apk" \
              --arg app_project "$REPO" \
              --arg version_name "$version_name" \
              --arg version_code "$version_code" \
              --arg channel "$CHANNEL" \
              --arg package_identity "$package" \
              --arg title "AEM build" \
              --arg source_release_id "github-actions-$RUN_ID" \
              '{repo:$repo,request_id:$request_id,run_id:$run_id,artifact_name:$artifact_name,app_project:$app_project,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id}')"
          echo
          echo "APK published through the AEM Supabase publisher."
      - name: Requeue if workflow is cancelled
        if: cancelled() && steps.claim.outputs.found == 'true'
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          REQUEST_ID: ${{ steps.claim.outputs.id }}
        run: |
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/build_requests?id=eq.$REQUEST_ID" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"status":"queued","workflow_run_id":null,"error":null,"updated_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'

      - name: Mark failed
        if: failure() && steps.claim.outputs.found == 'true'
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          REQUEST_ID: ${{ steps.claim.outputs.id }}
        run: |
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/build_requests?id=eq.$REQUEST_ID" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" --data '{"status":"failed","error":"Build or publication failed","updated_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'
