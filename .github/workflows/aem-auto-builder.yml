name: AEM Automatic GitHub Builder

concurrency:
  group: aem-build-queue
  cancel-in-progress: false

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
  actions: read
jobs:
  build-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Manager heartbeat
        shell: bash
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          GH_TOKEN: ${{ secrets.AEM_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/aem-build-queue" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "x-github-token: $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"action":"heartbeat"}'
      - name: Claim queued build
        id: claim
        shell: bash
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          GH_TOKEN: ${{ secrets.AEM_GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST "$SUPABASE_URL/functions/v1/aem-build-queue" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "x-github-token: $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg run "$RUN_ID" '{action:"claim",run_id:($run|tonumber)}')")"
          found="$(jq -r '.found // false' <<<"$response")"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" != "true" ]; then exit 0; fi
          jq -r '.request.id' <<<"$response" | xargs -I{} echo "id={}" >> "$GITHUB_OUTPUT"
          jq -r '.request.repository' <<<"$response" | xargs -I{} echo "repo={}" >> "$GITHUB_OUTPUT"
          jq -r '.request.ref' <<<"$response" | xargs -I{} echo "ref={}" >> "$GITHUB_OUTPUT"
          jq -r '.request.module // empty' <<<"$response" | xargs -I{} echo "module={}" >> "$GITHUB_OUTPUT"
          jq -r '.request.variant // "debug"' <<<"$response" | xargs -I{} echo "variant={}" >> "$GITHUB_OUTPUT"
          jq -r '.request.channel // "development"' <<<"$response" | xargs -I{} echo "channel={}" >> "$GITHUB_OUTPUT"
      - name: Checkout requested repository
        if: steps.claim.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.claim.outputs.repo }}
          ref: ${{ steps.claim.outputs.ref }}
          path: source
          token: ${{ secrets.AEM_GITHUB_TOKEN }}
      - name: Set up Node
        if: steps.claim.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        if: steps.claim.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        if: steps.claim.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Configure AEM Maven Central mirror
        if: steps.claim.outputs.found == 'true' && steps.claim.outputs.repo == 'Emmanuel001afk/AEM'
        working-directory: source
        run: |
          set -euo pipefail
          if [ -f "android/settings.gradle" ]; then
            python3 - <<'PY'
            from pathlib import Path
            p = Path("android/settings.gradle")
            s = p.read_text()
            mirror = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
            if mirror not in s:
                s = s.replace("mavenCentral()", mirror + "\n            mavenCentral()")
                p.write_text(s)
            PY
          fi

      - name: Build APK
        if: steps.claim.outputs.found == 'true'
        id: build
        working-directory: source
        env:
          MODULE: ${{ steps.claim.outputs.module }}
          VARIANT: ${{ steps.claim.outputs.variant }}
          REPO: ${{ steps.claim.outputs.repo }}
          AEM_KEYSTORE_BASE64: ${{ secrets.AEM_KEYSTORE_BASE64 }}
          AEM_KEYSTORE_PASSWORD: ${{ secrets.AEM_KEYSTORE_PASSWORD }}
          AEM_KEY_ALIAS: ${{ secrets.AEM_KEY_ALIAS }}
          AEM_KEY_PASSWORD: ${{ secrets.AEM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            npm install
            if [ -f "vite.mobile.config.ts" ]; then
              npx vite build --config vite.mobile.config.ts
            else
              npm run build
            fi
            npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
            npx --yes @capacitor/cli@7 add android
            if [ -f "android/app/build.gradle" ]; then
              python3 - <<'PY'
from pathlib import Path
import os,re
p=Path("android/app/build.gradle")
s=p.read_text()
run_number=os.environ.get("GITHUB_RUN_NUMBER","1")
version_code=str(int(__import__("time").time()))
s=re.sub(r"versionCode\s*(?:=\s*|\s+)\d+", f"versionCode {version_code}", s)
s=re.sub(r'versionName\s*(?:=\s*)?"[^"]+"', f'versionName "0.1.{run_number}"', s)
p.write_text(s)
PY
            fi
            if [ -f "native/MainActivity.java" ] && [ -f "native/AemInstallerPlugin.java" ]; then
              mkdir -p android/app/src/main/java/com/aem/store
              cp native/MainActivity.java android/app/src/main/java/com/aem/store/MainActivity.java
              cp native/AemInstallerPlugin.java android/app/src/main/java/com/aem/store/AemInstallerPlugin.java
              cp native/InstallResultReceiver.java android/app/src/main/java/com/aem/store/InstallResultReceiver.java
              python3 native/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
            fi
            npx --yes @capacitor/cli@7 copy android
            if [ "$VARIANT" = "release" ] && [ "$REPO" = "Emmanuel001afk/AEM" ]; then
              test -n "$AEM_KEYSTORE_BASE64"
              test -n "$AEM_KEYSTORE_PASSWORD"
              test -n "$AEM_KEY_ALIAS"
              test -n "$AEM_KEY_PASSWORD"
              printf "%s" "$AEM_KEYSTORE_BASE64" | base64 --decode > android/aem-release.keystore
              python3 - <<'PY'
from pathlib import Path
import re
p = Path("android/app/build.gradle")
s = p.read_text()
signing_block = '''signingConfigs {
    aemRelease {
        storeFile file("../aem-release.keystore")
        storePassword System.getenv("AEM_KEYSTORE_PASSWORD")
        keyAlias System.getenv("AEM_KEY_ALIAS")
        keyPassword System.getenv("AEM_KEY_PASSWORD")
    }
}'''
m = re.search(r'(?m)^android\s*\{', s)
if not m:
    raise SystemExit("Android build.gradle has no android block")
if "aemRelease" not in s:
    s = s[:m.end()] + "\n    " + signing_block.replace("\n", "\n    ") + "\n" + s[m.end():]
bt = re.search(r'(?m)^\s*buildTypes\s*\{', s)
if not bt:
    raise SystemExit("Android build.gradle has no buildTypes block")
rel = re.search(r'(?m)^\s*release\s*\{', s[bt.start():])
if not rel:
    raise SystemExit("Android build.gradle has no release build type")
start = bt.start() + rel.start()
op = s.find("{", start)
depth = 0
end = None
for i in range(op, len(s)):
    if s[i] == "{": depth += 1
    elif s[i] == "}":
        depth -= 1
        if depth == 0:
            end = i
            break
if end is None:
    raise SystemExit("Could not parse release block")
block = s[start:end]
if "signingConfig signingConfigs.aemRelease" not in block:
    s = s[:op+1] + "\n        signingConfig signingConfigs.aemRelease" + s[op+1:]
p.write_text(s)
PY
            fi
            if [ "$VARIANT" = "release" ]; then
              for attempt in 1 2 3 4 5; do
                echo "Release build attempt $attempt/5"
                if (cd android && ./gradlew --max-workers=2 assembleRelease); then
                  break
                fi
                if [ "$attempt" -eq 5 ]; then exit 1; fi
                sleep $((attempt * 20))
              done
            else
              (cd android && ./gradlew --max-workers=2 assembleDebug)
            fi
            if [ "$VARIANT" = "release" ]; then
              apk="$(find android -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1 | sed "s#^\./##")"
            else
              apk="$(find android -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1 | sed "s#^\./##")"
            fi
          else
            v="$(tr '[:lower:]' '[:upper:]' <<<"${VARIANT:0:1}")${VARIANT:1}"
            if [ -n "$MODULE" ]; then task=":$MODULE:assemble$v"; else task="assemble$v"; fi
            if [ -x "./gradlew" ]; then ./gradlew "$task"; else gradle "$task"; fi
            if [ "$VARIANT" = "release" ]; then
              apk="$(find . -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1 | sed "s#^\./##")"
            else
              apk="$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1 | sed "s#^\./##")"
            fi
          fi
          test -n "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload built APK as workflow artifact
        if: steps.claim.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aem-built-apk
          path: source/${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 1

      - name: Publish APK to AEM catalog
        if: steps.claim.outputs.found == 'true'
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          GH_TOKEN: ${{ secrets.AEM_GITHUB_TOKEN }}
          REQUEST_ID: ${{ steps.claim.outputs.id }}
          REPO: ${{ steps.claim.outputs.repo }}
          CHANNEL: ${{ steps.claim.outputs.channel }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          APK="source/${{ steps.build.outputs.apk }}"
          badging="$("$AAPT" dump badging "$APK" | head -n 1)"
          package="$(sed -n "s/.*package: name=\x27\\([^\x27]*\\).*/\\1/p" <<<"$badging")"
          version_code="$(sed -n "s/.*versionCode=\x27\\([^\x27]*\\).*/\\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.*versionName=\x27\\([^\x27]*\\).*/\\1/p" <<<"$badging")"
          app_name="$(sed -n "s/.*application-label=\x27\\([^\x27]*\\).*/\\1/p" <<<"$badging")"
          signing_cert="$(keytool -printcert -jarfile "$APK" | sed -n "/SHA256:/{s/^[[:space:]]*SHA256:[[:space:]]*//;p;q}")"
          test -n "$package"
          test -n "$version_name"
          test -n "$signing_cert"
          curl -fsS --data-binary "@$APK" "$SUPABASE_URL/functions/v1/aem-publish-github-artifact" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-aem-repo: $REPO" \
            -H "x-aem-request-id: $REQUEST_ID" \
            -H "x-aem-run-id: $RUN_ID" \
            -H "x-aem-filename: $(basename "$APK")" \
            -H "x-aem-app-name: $app_name" \
            -H "x-aem-version-name: $version_name" \
            -H "x-aem-version-code: $version_code" \
            -H "x-aem-channel: $CHANNEL" \
            -H "x-aem-package: $package" \
            -H "x-aem-signing-cert: $signing_cert" \
            -H "x-aem-title: AEM build" \
            -H "x-github-token: $GH_TOKEN" \
            -H "x-aem-source-release-id: github-actions-$RUN_ID"
          echo
          echo "APK published through the AEM Supabase publisher."
      - name: Requeue if workflow is cancelled
        if: cancelled() && steps.claim.outputs.found == 'true'
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.claim.outputs.id }}
          REPO: ${{ steps.claim.outputs.repo }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/aem-build-queue" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "x-github-token: $GH_TOKEN" \
            -H "Content-Type: application/json" --data "$(jq -nc --arg id "$REQUEST_ID" --arg repo "$REPO" --arg run "$RUN_ID" '{action:"cancel",id:$id,repository:$repo,run_id:($run|tonumber)}')"

      - name: Mark failed
        if: failure() && steps.claim.outputs.found == 'true'
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.claim.outputs.id }}
          REPO: ${{ steps.claim.outputs.repo }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/aem-build-queue" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "x-github-token: $GH_TOKEN" \
            -H "Content-Type: application/json" --data "$(jq -nc --arg id "$REQUEST_ID" --arg repo "$REPO" --arg run "$RUN_ID" --arg error "Build or publication failed" '{action:"fail",id:$id,repository:$repo,run_id:($run|tonumber),error:$error}')"
