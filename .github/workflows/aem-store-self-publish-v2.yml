name: AEM Store Self Publish V2

on:
  workflow_run:
    workflows: ["AEM Store Android APK Final"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-release-apk
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish through AEM Supabase gateway
        env:
          APK: release/app-release.apk
          GH_TOKEN: ${{ secrets.APK_STORE_TOKEN }}
        run: |
          set -euo pipefail
          signing_cert="$(keytool -printcert -jarfile "$APK" | sed -n '/SHA256:/{s/^[[:space:]]*SHA256:[[:space:]]*//;p;q}')"
          test -n "$signing_cert"
          SUPABASE_KEY="$(sed -n 's/.*DEFAULT_PUBLISHABLE_KEY="\([^"]*\)".*/\1/p' src/services/supabase/client.ts)"
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt | sort -V | tail -n 1)"
          badging="$("$AAPT" dump badging "$APK" | head -n 1)"
          package="$(sed -n "s/.*package: name='\\([^\']*\\)'.*/\\1/p" <<<"$badging")"
          version_code="$(sed -n "s/.*versionCode='\\([^\']*\\)'.*/\\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.*versionName='\\([^\']*\\)'.*/\\1/p" <<<"$badging")"
          app_name="$(sed -n "s/.*application-label='\\([^\']*\\)'.*/\\1/p" <<<"$badging")"
          curl -fsS --data-binary "@$APK" "https://wfvvmyixqcwosmuldxoq.supabase.co/functions/v1/aem-publish-github-artifact" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-aem-repo: Emmanuel001afk/AEM" \
            -H "x-github-token: $GH_TOKEN" \
            -H "x-aem-run-id: ${{ github.event.workflow_run.id }}" \
            -H "x-aem-filename: $(basename "$APK")" \
            -H "x-aem-app-name: $app_name" \
            -H "x-aem-version-name: $version_name" \
            -H "x-aem-version-code: $version_code" \
            -H "x-aem-channel: development" \
            -H "x-aem-package: $package" \
            -H "x-aem-signing-cert: $signing_cert" \
            -H "x-aem-title: AEM Store APK" \
            -H "x-aem-source-release-id: github-actions-${{ github.event.workflow_run.id }}"
