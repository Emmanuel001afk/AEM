name: AEM Store Self Publish V2

on:
  workflow_run:
    workflows: ["AEM Store Android APK Final"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-release-apk
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish through AEM Supabase gateway
        env:
          APK: release/app-release.apk
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signing_cert="$(keytool -printcert -jarfile "$APK" | sed -n '/SHA256:/{s/^[[:space:]]*SHA256:[[:space:]]*//;p;q}')"
          test -n "$signing_cert"
          SUPABASE_KEY="$(sed -n 's/.*DEFAULT_PUBLISHABLE_KEY="\([^"]*\)".*/\1/p' src/services/supabase/client.ts)"
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt | sort -V | tail -n 1)"
          badging="$("$AAPT" dump badging "$APK" | head -n 1)"
          package="$(sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          app_name="$(sed -n "s/.*application-label='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          size_bytes="$(stat -c '%s' "$APK")"
          sha256="$(sha256sum "$APK" | awk '{print $1}')"
          META="$(jq -n \
            --arg action "prepare" \
            --arg repo "Emmanuel001afk/AEM" \
            --argjson run_id "${{ github.event.workflow_run.id }}" \
            --arg filename "$(basename "$APK")" \
            --arg application_name "$app_name" \
            --arg version_name "$version_name" \
            --argjson version_code "$version_code" \
            --arg channel "stable" \
            --arg package_identity "$package" \
            --arg title "AEM Store APK" \
            --arg source_release_id "github-actions-${{ github.event.workflow_run.id }}" \
            --arg signing_certificate_sha256 "$signing_cert" \
            '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256}')"
          PREPARE="$(curl -fsS -X POST "https://wfvvmyixqcwosmuldxoq.supabase.co/functions/v1/aem-publish-github-artifact" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -H "x-github-token: $GH_TOKEN" --data "$META")"
          upload_url="$(jq -r '.upload_url' <<<"$PREPARE")"
          test -n "$upload_url" -a "$upload_url" != "null"
          curl -fsS -X PUT "$upload_url" -H "Content-Type: application/vnd.android.package-archive" --data-binary "@$APK"
          FINALIZE="$(jq -n \
            --arg action "finalize" \
            --arg repo "Emmanuel001afk/AEM" \
            --argjson run_id "${{ github.event.workflow_run.id }}" \
            --arg filename "$(basename "$APK")" \
            --arg application_name "$app_name" \
            --arg version_name "$version_name" \
            --argjson version_code "$version_code" \
            --arg channel "stable" \
            --arg package_identity "$package" \
            --arg title "AEM Store APK" \
            --arg source_release_id "github-actions-${{ github.event.workflow_run.id }}" \
            --arg signing_certificate_sha256 "$signing_cert" \
            --argjson size_bytes "$size_bytes" \
            --arg sha256 "$sha256" \
            '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256,size_bytes:$size_bytes,sha256:$sha256}')"
          curl -fsS -X POST "https://wfvvmyixqcwosmuldxoq.supabase.co/functions/v1/aem-publish-github-artifact" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -H "x-github-token: $GH_TOKEN" --data "$FINALIZE"
