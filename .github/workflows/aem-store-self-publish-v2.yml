name: AEM Store Self Publish V2

on:
  workflow_run:
    workflows: ["AEM Store Android APK Final"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: aem-store-stable-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-release-apk
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish through AEM Supabase gateway
        env:
          APK: release/app-release.apk
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          signing_cert=""
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            signing_cert="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n 1 || true)"
          fi
          if [ -z "$signing_cert" ]; then
            signing_cert="$(keytool -printcert -jarfile "$APK" 2>/dev/null | sed -n '/SHA256:/{s/^[[:space:]]*SHA256:[[:space:]]*//;p;q}' || true)"
          fi
          signing_cert="$(printf '%s' "$signing_cert" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$signing_cert"
          SUPABASE_KEY="$(sed -n 's/.*DEFAULT_PUBLISHABLE_KEY="\([^"]*\)".*/\1/p' src/services/supabase/client.ts)"
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt | sort -V | tail -n 1)"
          badging="$("$AAPT" dump badging "$APK")"
          package="$(sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_code="$(sed -n "s/.*package:.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_name="$(sed -n "s/.*package:.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          app_name="$(sed -n "s/.*application-label='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          size_bytes="$(stat -c '%s' "$APK")"
          sha256="$(sha256sum "$APK" | awk '{print $1}')"
          META="$(jq -n \
            --arg action "prepare" \
            --arg repo "Emmanuel001afk/AEM" \
            --argjson run_id "${{ github.event.workflow_run.id }}" \
            --arg filename "$(basename "$APK")" \
            --arg application_name "$app_name" \
            --arg version_name "$version_name" \
            --argjson version_code "$version_code" \
            --arg channel "stable" \
            --arg package_identity "$package" \
            --arg title "AEM Store APK" \
            --arg source_release_id "github-actions-${{ github.event.workflow_run.id }}" \
            --arg signing_certificate_sha256 "$signing_cert" \
            '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256}')"
          prepare_upload() {
            local response_file status prepare_attempt
            for prepare_attempt in 1 2 3; do
              response_file="$(mktemp)"
              status="$(
                curl -sS -o "$response_file" -w '%{http_code}' \
                  --connect-timeout 30 --max-time 60 \
                  -X POST "https://wfvvmyixqcwosmuldxoq.supabase.co/functions/v1/aem-publish-github-artifact" \
                  -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
                  -H "Content-Type: application/json" -H "x-github-token: $GH_TOKEN" \
                  --data "$META"
              )" || status="000"
              if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                cat "$response_file"
                rm -f "$response_file"
                return 0
              fi
              echo "Prepare attempt $prepare_attempt failed with HTTP $status" >&2
              cat "$response_file" >&2
              if [[ "$status" == "409" ]]; then
                response_body="$(cat "$response_file")"
                if grep -Fq "latest published stable version code is $version_code" <<<"$response_body"; then
                  echo "Version code $version_code is already the latest stable release; treating publish as idempotent success." >&2
                  rm -f "$response_file"
                  return 0
                fi
                echo "Publish rejected: APK versionCode is not newer than the latest stable release." >&2
                rm -f "$response_file"
                return 1
              fi
              rm -f "$response_file"
              if [[ "$prepare_attempt" -lt 3 ]]; then
                sleep $((prepare_attempt * 15))
              fi
            done
            return 1
          }

          PREPARE="$(prepare_upload)" || {
            echo "Unable to prepare Supabase upload after retries" >&2
            exit 1
          }
          upload_url="$(jq -er '.upload_url' <<<"$PREPARE")"
          object_path="$(jq -er '.path // .Key' <<<"$PREPARE")"
          upload_response="$(mktemp)"
          upload_headers="$(mktemp)"
          apk_size="$size_bytes"
          for attempt in 1 2 3; do
            status="$(
              curl -sS -D "$upload_headers" -o "$upload_response" -w '%{http_code}' \
                --connect-timeout 30 --max-time 600 \
                -X PUT "$upload_url" \
                -H "Content-Type: application/vnd.android.package-archive" \
                -H "Content-Length: $apk_size" \
                -H "x-upsert: true" \
                -H "Cache-Control: max-age=3600" \
                --upload-file "$APK"
            )" || status="000"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              cat "$upload_response"
              break
            fi
            echo "APK upload attempt $attempt failed with HTTP $status" >&2
            echo "Response headers:" >&2
            cat "$upload_headers" >&2
            echo "Response body:" >&2
            cat "$upload_response" >&2
            public_url="https://wfvvmyixqcwosmuldxoq.supabase.co/storage/v1/object/public/aem-artifacts/$object_path"
            verify_headers="$(mktemp)"
            verify_status="$(curl -sS -D "$verify_headers" -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 60 "$public_url")" || verify_status="000"
            verify_size="$(awk 'BEGIN{IGNORECASE=1} /^content-length:/{gsub("\r","",$2); print $2; exit}' "$verify_headers")"
            if [[ "$verify_status" =~ ^2[0-9][0-9]$ ]] && [[ -z "$verify_size" || "$verify_size" = "$apk_size" ]]; then
              echo "Storage contains the complete APK despite upload response HTTP $status; continuing to finalize." >&2
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
            PREPARE="$(prepare_upload)" || {
              echo "Unable to refresh Supabase upload URL after retries" >&2
              exit 1
            }
            upload_url="$(jq -er '.upload_url' <<<"$PREPARE")"
            object_path="$(jq -er '.path // .Key' <<<"$PREPARE")"
          done
          FINALIZE="$(jq -n \
            --arg action "finalize" \
            --arg repo "Emmanuel001afk/AEM" \
            --argjson run_id "${{ github.event.workflow_run.id }}" \
            --arg filename "$(basename "$APK")" \
            --arg application_name "$app_name" \
            --arg version_name "$version_name" \
            --argjson version_code "$version_code" \
            --arg channel "stable" \
            --arg package_identity "$package" \
            --arg title "AEM Store APK" \
            --arg source_release_id "github-actions-${{ github.event.workflow_run.id }}" \
            --arg signing_certificate_sha256 "$signing_cert" \
            --arg object_path "$object_path" \
            --arg path "$object_path" \
            --argjson size_bytes "$size_bytes" \
            --arg sha256 "$sha256" \
            '{action:$action,repo:$repo,run_id:$run_id,filename:$filename,application_name:$application_name,version_name:$version_name,version_code:$version_code,channel:$channel,package_identity:$package_identity,title:$title,source_release_id:$source_release_id,signing_certificate_sha256:$signing_certificate_sha256,object_path:$object_path,path:$path,size_bytes:$size_bytes,sha256:$sha256}')"
          finalize_response="$(mktemp)"
          finalize_headers="$(mktemp)"
          finalize_status="$(
            curl -sS -D "$finalize_headers" -o "$finalize_response" -w '%{http_code}' \
              --connect-timeout 30 --max-time 120 \
              -X POST "https://wfvvmyixqcwosmuldxoq.supabase.co/functions/v1/aem-publish-github-artifact" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" -H "x-github-token: $GH_TOKEN" \
              --data "$FINALIZE"
          )" || finalize_status="000"
          if [[ ! "$finalize_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Finalize failed with HTTP $finalize_status" >&2
            echo "Response headers:" >&2
            cat "$finalize_headers" >&2
            echo "Response body:" >&2
            cat "$finalize_response" >&2
            exit 1
          fi
          cat "$finalize_response"
