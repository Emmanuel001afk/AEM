name: AEM checks (desktop extended)
on: [push, pull_request]
jobs:
  web-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm run typecheck:electron
      - run: npm run build
      - run: npm run verify
