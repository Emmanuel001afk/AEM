name: AEM Store Combined Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aem-store-combined-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Build and sign Android APK
    uses: ./.github/workflows/aem-android-final.yml
    secrets: inherit

  windows:
    name: Build and verify Windows EXEs
    uses: ./.github/workflows/aem-desktop.yml
    secrets: inherit

  verify-and-package:
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-release-apk
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-windows
          path: release
      - name: Validate complete deliverable set and checksums
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs release
          node scripts/stamp-version.mjs
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); fs.writeFileSync('release/release.json',JSON.stringify({family:'com.aem.store',version:p.version,androidVersionCode:1810000000+Number(process.env.GITHUB_RUN_NUMBER),source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID},null,2))"
          cp docs/desktop/DOWNLOADS.md release/INSTALL.md
          (cd release && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: aem-store-complete-release
          path: release/**
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify-and-package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-complete-release
          path: release
      - name: Publish only after verifying downloadable draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version release/release.json)"
          tag="v$version"
          (cd release && zip -q "AEM-Store-$version-Complete.zip" app-release.apk *.exe SHA256SUMS.txt INSTALL.md release.json)
          if gh release view "$tag" --json isDraft --jq .isDraft > is-draft.txt; then
            test "$(cat is-draft.txt)" = true || { echo "Refusing to overwrite a published release"; exit 1; }
          else
            gh release create "$tag" --target "$SOURCE_SHA" --draft --title "AEM Store $version" --notes-file release/INSTALL.md
          fi
          gh release upload "$tag" release/* --clobber
          mkdir downloaded
          gh release download "$tag" --dir downloaded --pattern '*.exe' --pattern '*.apk' --pattern SHA256SUMS.txt
          (cd downloaded && sha256sum -c SHA256SUMS.txt)
          # This is deliberately last: any failed build/download leaves a draft, never a latest release.
          gh release edit "$tag" --draft=false --latest
