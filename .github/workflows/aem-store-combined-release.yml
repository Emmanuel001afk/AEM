name: AEM Store Combined Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aem-store-combined-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Build and sign Android APK
    uses: ./.github/workflows/aem-android-final.yml
    secrets: inherit

  windows:
    name: Build and verify Windows EXEs
    uses: ./.github/workflows/aem-desktop.yml
    secrets: inherit

  android-smoke:
    name: Signed APK installation and launch on Android AVD
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-release-apk
          path: release
      - name: Enable KVM on disposable CI runner
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-smoke.sh
      - name: Runtime smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aem-android-runtime-diagnostics
          path: |
            android-launch.txt
            android-relaunch.txt
            android-window.xml
            android-runtime.log
          if-no-files-found: warn

  managed-emulator-smoke:
    name: AEM-managed API 34 emulator lifecycle
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-release-apk
          path: release
      - name: Install real emulator tools and API 34 image
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          if ! "$sdkmanager" "emulator" "platform-tools" "build-tools;34.0.0" "system-images;android-34;google_apis;x86_64" > sdk-setup.log 2>&1; then
            node -e "const fs=require('fs');console.log('::error title=Runtime SDK setup::'+fs.readFileSync('sdk-setup.log','utf8').slice(-6000).replaceAll('%','%25').replaceAll('\\r','%0D').replaceAll('\\n','%0A'))"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
      - run: npm ci
      - run: npm run build:electron
      - name: Exercise AEM diagnostics, AVD creation, install, launch and teardown
        run: |
          if ! xvfb-run -a node_modules/.bin/electron scripts/emulator-runtime-smoke.cjs > aem-electron-runtime.log 2>&1; then
            node -e "const fs=require('fs');console.log('::error title=AEM Electron runtime::'+fs.readFileSync('aem-electron-runtime.log','utf8').slice(-6000).replaceAll('%','%25').replaceAll('\\r','%0D').replaceAll('\\n','%0A'))"
            exit 1
          fi
          cat aem-electron-runtime.log
      - name: Managed emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aem-managed-emulator-diagnostics
          path: |
            aem-electron-runtime.log
            sdk-setup.log
            aem-runtime-diagnostics.json
            aem-managed-window.xml
            ${{ runner.temp }}/aem-managed-emulator-smoke/logs/*.log
          if-no-files-found: warn

  verify-and-package:
    runs-on: ubuntu-latest
    needs: [android, android-smoke, managed-emulator-smoke, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-release-apk
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-windows
          path: release
      - name: Validate complete deliverable set and checksums
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs release
          node scripts/stamp-version.mjs
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); fs.writeFileSync('release/release.json',JSON.stringify({family:'com.aem.store',version:p.version,androidVersionCode:1810000000+Number(process.env.GITHUB_RUN_NUMBER),source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID},null,2))"
          cp docs/desktop/DOWNLOADS.md release/INSTALL.md
          (cd release && sha256sum -c SHA256SUMS.txt)
          node --input-type=module -e "import fs from 'node:fs'; console.log('::notice title=Verified deliverable checksums::'+fs.readFileSync('release/SHA256SUMS.txt','utf8').trim().replaceAll('\n','%0A'))"
      - uses: actions/upload-artifact@v4
        with:
          name: aem-store-complete-release
          path: release/**
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify-and-package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aem-store-complete-release
          path: release
      - name: Publish only after verifying downloadable draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version release/release.json)"
          tag="v$version"
          (cd release && zip -q "AEM-Store-$version-Complete.zip" app-release.apk *.exe SHA256SUMS.txt INSTALL.md release.json)
          if gh release view "$tag" --json isDraft --jq .isDraft > is-draft.txt; then
            test "$(cat is-draft.txt)" = true || { echo "Refusing to overwrite a published release"; exit 1; }
          else
            gh release create "$tag" --target "$SOURCE_SHA" --draft --title "AEM Store $version" --notes-file release/INSTALL.md
          fi
          gh release upload "$tag" release/* --clobber
          mkdir downloaded
          gh release download "$tag" --dir downloaded --pattern '*.exe' --pattern '*.apk' --pattern SHA256SUMS.txt
          (cd downloaded && sha256sum -c SHA256SUMS.txt)
          # This is deliberately last: any failed build/download leaves a draft, never a latest release.
          gh release edit "$tag" --draft=false --latest
