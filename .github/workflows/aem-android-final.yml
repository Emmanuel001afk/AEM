name: AEM Store Android APK Final

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npx vite build --config vite.mobile.config.ts
      - run: npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
      - run: npx --yes @capacitor/cli@7 add android
      - run: mkdir -p android/app/src/main/java/com/aem/store
      - run: cp native/AemInstallerPlugin.java android/app/src/main/java/com/aem/store/AemInstallerPlugin.java
      - run: cp native/MainActivity.java android/app/src/main/java/com/aem/store/MainActivity.java
      - run: cp native/InstallResultReceiver.java android/app/src/main/java/com/aem/store/InstallResultReceiver.java
      - run: python3 native/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
      - run: npx --yes @capacitor/cli@7 copy android
      - name: Stamp CI version
        env:
          RUN_NUMBER: \${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          n = os.environ["RUN_NUMBER"]
          s = re.sub(r"versionCode\s*(?:=\s*|\s+)\d+", f"versionCode {n}", s)
          s = re.sub(r'versionName\s*(?:=\s*)?"[^"]+"', f'versionName "0.1.{n}"', s)
          p.write_text(s)
          PY

      - working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aem-store-debug-apk-final
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
