name: AEM Store Android APK Final

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aem-store-android-build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true
      - run: npm install
      - run: npx vite build --config vite.mobile.config.ts
      - run: npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
      - run: npx --yes @capacitor/cli@7 add android
      - run: mkdir -p android/app/src/main/java/com/aem/store
      - run: cp native/AemInstallerPlugin.java android/app/src/main/java/com/aem/store/AemInstallerPlugin.java
      - run: cp native/MainActivity.java android/app/src/main/java/com/aem/store/MainActivity.java
      - run: cp native/InstallResultReceiver.java android/app/src/main/java/com/aem/store/InstallResultReceiver.java
      - run: python3 native/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
      - run: npx --yes @capacitor/cli@7 copy android

      - name: Stamp CI version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          n = os.environ["RUN_NUMBER"]
          version_code = str(int(__import__("time").time()))
          s = re.sub(r"versionCode\s*(?:=\s*|\s+)\d+", f"versionCode {version_code}", s)
          s = re.sub(r'versionName\s*(?:=\s*)?"[^"]+"', f'versionName "0.1.{n}"', s)
          p.write_text(s)
          PY

      - name: Configure stable release signing
        env:
          AEM_KEYSTORE_BASE64: ${{ secrets.AEM_KEYSTORE_BASE64 }}
          AEM_KEYSTORE_PASSWORD: ${{ secrets.AEM_KEYSTORE_PASSWORD }}
          AEM_KEY_ALIAS: ${{ secrets.AEM_KEY_ALIAS }}
          AEM_KEY_PASSWORD: ${{ secrets.AEM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AEM_KEYSTORE_BASE64" || { echo "Missing AEM_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$AEM_KEYSTORE_PASSWORD" || { echo "Missing AEM_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$AEM_KEY_ALIAS" || { echo "Missing AEM_KEY_ALIAS repository secret."; exit 1; }
          test -n "$AEM_KEY_PASSWORD" || { echo "Missing AEM_KEY_PASSWORD repository secret."; exit 1; }
          printf '%s' "$AEM_KEYSTORE_BASE64" | base64 --decode > android/aem-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing_block = '''signingConfigs {
              aemRelease {
                  storeFile file("../aem-release.keystore")
                  storePassword System.getenv("AEM_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("AEM_KEY_ALIAS")
                  keyPassword System.getenv("AEM_KEY_PASSWORD")
              }
          }'''
          android_match = re.search(r'(?m)^android\s*\{', s)
          if not android_match: raise SystemExit("Android build.gradle has no android block")
          insert_at = android_match.end()
          if "aemRelease" not in s:
              s = s[:insert_at] + "\n    " + signing_block.replace("\n", "\n    ") + "\n" + s[insert_at:]
          build_types_match = re.search(r'(?m)^\s*buildTypes\s*\{', s)
          if not build_types_match: raise SystemExit("Android build.gradle has no buildTypes block")
          release_match = re.search(r'(?m)^\s*release\s*\{', s[build_types_match.start():])
          if not release_match: raise SystemExit("Android build.gradle has no release build type")
          release_start = build_types_match.start() + release_match.start()
          release_open = s.find("{", release_start)
          depth = 0
          release_end = None
          for i in range(release_open, len(s)):
              if s[i] == "{": depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      release_end = i
                      break
          if release_end is None: raise SystemExit("Could not parse release build type")
          release_block = s[release_start:release_end]
          if "signingConfig signingConfigs.aemRelease" not in release_block:
              s = s[:release_open+1] + "\n        signingConfig signingConfigs.aemRelease" + s[release_open+1:]
          p.write_text(s)
          PY

      - name: Configure Maven Central mirror
        working-directory: android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("settings.gradle")
          if not p.exists(): raise SystemExit("Capacitor Android settings.gradle not found")
          s = p.read_text()
          mirror = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
          if mirror not in s:
              s = s.replace("mavenCentral()", mirror + "\n            mavenCentral()")
              p.write_text(s)
          PY

      - name: Validate release configuration
        working-directory: android
        run: |
          set -euo pipefail
          test -f app/build.gradle
          grep -q "aemRelease" app/build.gradle
          grep -q "signingConfig signingConfigs.aemRelease" app/build.gradle
          test -f aem-release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          AEM_KEYSTORE_PASSWORD: ${{ secrets.AEM_KEYSTORE_PASSWORD }}
          AEM_KEY_ALIAS: ${{ secrets.AEM_KEY_ALIAS }}
          AEM_KEY_PASSWORD: ${{ secrets.AEM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Release build attempt $attempt/5"
            if ./gradlew --max-workers=2 assembleRelease; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aem-store-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

