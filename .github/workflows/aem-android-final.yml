name: AEM Store Android APK Final
# Rebuild after native Android compile fix

on:
  workflow_call:

concurrency:
  group: aem-store-android-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true
      - name: Test bounded native archive extraction on JVM
        run: |
          mkdir -p /tmp/aem-java-tests
          javac -d /tmp/aem-java-tests native/AemPackageArchive.java tests/native/AemPackageArchiveTest.java
          java -cp /tmp/aem-java-tests com.aem.store.AemPackageArchiveTest
      - run: npm ci
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aem-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
      - run: npx vite build --config vite.mobile.config.ts
      - run: npm install --no-save @capacitor/cli@7.4.4 @capacitor/core@7.4.4 @capacitor/android@7.4.4
      - run: npx --yes @capacitor/cli@7.4.4 add android
      - run: mkdir -p android/app/src/main/java/com/aem/store
      - run: cp native/AemInstallerPlugin.java android/app/src/main/java/com/aem/store/AemInstallerPlugin.java
      - run: cp native/AemTransferPlugin.java android/app/src/main/java/com/aem/store/AemTransferPlugin.java
      - run: cp native/AemTransferActivity.java android/app/src/main/java/com/aem/store/AemTransferActivity.java
      - run: cp native/AemTransferService.java android/app/src/main/java/com/aem/store/AemTransferService.java
      - run: cp native/AemPackageArchive.java android/app/src/main/java/com/aem/store/AemPackageArchive.java
      - run: cp native/MainActivity.java android/app/src/main/java/com/aem/store/MainActivity.java
      - run: cp native/InstallResultReceiver.java android/app/src/main/java/com/aem/store/InstallResultReceiver.java
      - run: cp native/InstallConfirmationActivity.java android/app/src/main/java/com/aem/store/InstallConfirmationActivity.java
      - run: python3 native/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
      - run: npx --yes @capacitor/cli@7.4.4 copy android

      - name: Stamp shared release version
        run: node scripts/stamp-version.mjs

      - name: Configure stable release signing
        env:
          AEM_KEYSTORE_BASE64: ${{ secrets.AEM_KEYSTORE_BASE64 }}
          AEM_KEYSTORE_PASSWORD: ${{ secrets.AEM_KEYSTORE_PASSWORD }}
          AEM_KEY_ALIAS: ${{ secrets.AEM_KEY_ALIAS }}
          AEM_KEY_PASSWORD: ${{ secrets.AEM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AEM_KEYSTORE_BASE64" || { echo "Missing AEM_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$AEM_KEYSTORE_PASSWORD" || { echo "Missing AEM_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$AEM_KEY_ALIAS" || { echo "Missing AEM_KEY_ALIAS repository secret."; exit 1; }
          test -n "$AEM_KEY_PASSWORD" || { echo "Missing AEM_KEY_PASSWORD repository secret."; exit 1; }
          printf '%s' "$AEM_KEYSTORE_BASE64" | base64 --decode > android/aem-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing_block = '''signingConfigs {
              aemRelease {
                  storeFile file("../aem-release.keystore")
                  storePassword System.getenv("AEM_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("AEM_KEY_ALIAS")
                  keyPassword System.getenv("AEM_KEY_PASSWORD")
              }
          }'''
          android_match = re.search(r'(?m)^android\s*\{', s)
          if not android_match: raise SystemExit("Android build.gradle has no android block")
          insert_at = android_match.end()
          if "aemRelease" not in s:
              s = s[:insert_at] + "\n    " + signing_block.replace("\n", "\n    ") + "\n" + s[insert_at:]
          build_types_match = re.search(r'(?m)^\s*buildTypes\s*\{', s)
          if not build_types_match: raise SystemExit("Android build.gradle has no buildTypes block")
          release_match = re.search(r'(?m)^\s*release\s*\{', s[build_types_match.start():])
          if not release_match: raise SystemExit("Android build.gradle has no release build type")
          release_start = build_types_match.start() + release_match.start()
          release_open = s.find("{", release_start)
          depth = 0
          release_end = None
          for i in range(release_open, len(s)):
              if s[i] == "{": depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      release_end = i
                      break
          if release_end is None: raise SystemExit("Could not parse release build type")
          release_block = s[release_start:release_end]
          if "signingConfig signingConfigs.aemRelease" not in release_block:
              s = s[:release_open+1] + "\n        signingConfig signingConfigs.aemRelease" + s[release_open+1:]
          p.write_text(s)
          PY

      - name: Configure Maven Central mirror
        working-directory: android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("settings.gradle")
          if not p.exists(): raise SystemExit("Capacitor Android settings.gradle not found")
          s = p.read_text()
          mirror = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
          if mirror not in s:
              s = s.replace("mavenCentral()", mirror + "\n            mavenCentral()")
              p.write_text(s)
          PY

      - name: Validate release configuration
        working-directory: android
        run: |
          set -euo pipefail
          test -f app/build.gradle
          grep -q "aemRelease" app/build.gradle
          grep -q "signingConfig signingConfigs.aemRelease" app/build.gradle
          test -f aem-release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          AEM_KEYSTORE_PASSWORD: ${{ secrets.AEM_KEYSTORE_PASSWORD }}
          AEM_KEY_ALIAS: ${{ secrets.AEM_KEY_ALIAS }}
          AEM_KEY_PASSWORD: ${{ secrets.AEM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Release build attempt $attempt/5"
            if ./gradlew --max-workers=2 assembleRelease 2>&1 | tee ../android-build.log; then exit 0; fi
            if grep -qE "error:|Compilation failed" ../android-build.log; then break; fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 20)); fi
          done
          python3 - <<'PYERROR'
          from pathlib import Path
          text = Path("../android-build.log").read_text(errors="replace")
          tail = "\n".join(text.splitlines()[-90:])
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Android build failure::" + escaped)
          PYERROR
          exit 1

      - name: Verify signed Android package and identity
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          test -x "$tools"
          "$tools" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          "$(dirname "$tools")/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk | tee android-badging.txt
          grep -q "package: name='com.aem.store'" android-badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aem-store-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
