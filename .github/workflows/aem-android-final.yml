name: AEM Store Android APK Final

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true
      - run: npm install
      - run: npx vite build --config vite.mobile.config.ts
      - run: npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
      - run: npx --yes @capacitor/cli@7 add android
      - run: mkdir -p android/app/src/main/java/com/aem/store
      - run: cp native/AemInstallerPlugin.java android/app/src/main/java/com/aem/store/AemInstallerPlugin.java
      - run: cp native/MainActivity.java android/app/src/main/java/com/aem/store/MainActivity.java
      - run: cp native/InstallResultReceiver.java android/app/src/main/java/com/aem/store/InstallResultReceiver.java
      - run: python3 native/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
      - run: npx --yes @capacitor/cli@7 copy android
      - name: Stamp CI version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          n = os.environ["RUN_NUMBER"]
          s = re.sub(r"versionCode\s*(?:=\s*|\s+)\d+", f"versionCode {n}", s)
          s = re.sub(r'versionName\s*(?:=\s*)?"[^"]+"', f'versionName "0.1.{n}"', s)
          p.write_text(s)
          PY

      - name: Configure stable release signing
        env:
          AEM_KEYSTORE_BASE64: ${{ secrets.AEM_KEYSTORE_BASE64 }}
          AEM_KEYSTORE_PASSWORD: ${{ secrets.AEM_KEYSTORE_PASSWORD }}
          AEM_KEY_ALIAS: ${{ secrets.AEM_KEY_ALIAS }}
          AEM_KEY_PASSWORD: ${{ secrets.AEM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AEM_KEYSTORE_BASE64" || { echo "Missing AEM_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$AEM_KEYSTORE_PASSWORD" || { echo "Missing AEM_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$AEM_KEY_ALIAS" || { echo "Missing AEM_KEY_ALIAS repository secret."; exit 1; }
          test -n "$AEM_KEY_PASSWORD" || { echo "Missing AEM_KEY_PASSWORD repository secret."; exit 1; }
          printf '%s' "$AEM_KEYSTORE_BASE64" | base64 --decode > android/aem-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = r'''
          android {
              signingConfigs {
                  aemRelease {
                      storeFile file("../aem-release.keystore")
                      storePassword System.getenv("AEM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("AEM_KEY_ALIAS")
                      keyPassword System.getenv("AEM_KEY_PASSWORD")
                  }
              }
          }
          '''
          # Inject only the signing config block before the existing android block.
          s = signing + "\n" + s
          s = s.replace("buildTypes {", "buildTypes {", 1)
          marker = "buildTypes {"
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit("Android build.gradle has no buildTypes block")
          release_marker = "release {"
          rpos = s.find(release_marker, pos)
          if rpos < 0:
              s = s[:pos] + marker + "\n        release { signingConfig signingConfigs.aemRelease }\n" + s[pos+len(marker):]
          else:
              end = s.find("}", rpos)
              if end < 0:
                  raise SystemExit("Could not locate release build type")
              block = s[rpos:end]
              if "signingConfig" not in block:
                  s = s[:rpos] + "release {\n            signingConfig signingConfigs.aemRelease\n        " + s[rpos+len(release_marker):end] + "}" + s[end+1:]
          p.write_text(s)
          PY

      - name: Configure Maven Central mirror
        working-directory: android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("settings.gradle")
          if not p.exists():
              raise SystemExit("Capacitor Android settings.gradle not found")
          s = p.read_text()
          mirror = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
          if mirror not in s:
              s = s.replace("mavenCentral()", mirror + "\n            mavenCentral()")
              p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          AEM_KEYSTORE_PASSWORD: ${{ secrets.AEM_KEYSTORE_PASSWORD }}
          AEM_KEY_ALIAS: ${{ secrets.AEM_KEY_ALIAS }}
          AEM_KEY_PASSWORD: ${{ secrets.AEM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Release build attempt $attempt/5"
            if ./gradlew --max-workers=2 assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aem-store-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

# CI trigger refresh: build the current stable-signed release pipeline.
# Verification run requested.
