name: AEM Desktop — Windows Build

on:
  workflow_call:

concurrency:
  group: aem-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:electron
      - run: npm run build   # renderer + Electron main compile and module marker
      - run: npm run verify
      - run: npm run test:unit
      - run: npm run verify:emulator

  build-win:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }
      - run: npm ci
      - name: Stamp shared release version
        run: node scripts/stamp-version.mjs
      - run: npm run typecheck
      - run: npm run typecheck:electron
      - name: Build Windows Installer and Portable EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          npm run build:win 2>&1 | Tee-Object windows-build.log
          if ($LASTEXITCODE -ne 0) {
            $message = ((Get-Content windows-build.log -Tail 90) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows packaging failure::$message"
            exit 1
          }
      - name: Verify PE structure
        run: node --input-type=module -e "import {verifyPE} from './scripts/verify-release.mjs'; import fs from 'node:fs'; for (const f of fs.readdirSync('release').filter(f=>f.endsWith('.exe'))) verifyPE('release/'+f); verifyPE('release/win-unpacked/AEM Store.exe')"
      - name: Find previous successful build on this branch for upgrade regression
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $runs = (gh api "repos/$env:GH_REPO/actions/workflows/aem-store-combined-release.yml/runs?status=success&per_page=20" | ConvertFrom-Json).workflow_runs
          foreach ($run in $runs) {
            if ($run.head_branch -ne $env:SOURCE_BRANCH) { continue }
            $artifacts = (gh api "repos/$env:GH_REPO/actions/runs/$($run.id)/artifacts" | ConvertFrom-Json).artifacts
            if ($artifacts | Where-Object { $_.name -eq 'aem-store-windows' -and !$_.expired }) {
              "run=$($run.id)" >> $env:GITHUB_OUTPUT
              break
            }
          }
      - name: Download previous verified Windows build
        if: steps.previous.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: aem-store-windows
          path: previous-release
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
      - name: Installed and portable application smoke tests
        shell: pwsh
        run: |
          try { ./scripts/windows-smoke.ps1 }
          catch {
            $message = ($_.Exception.Message + "`n" + $_.ScriptStackTrace).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows installation smoke failure::$message"
            exit 1
          }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Native source delivery integration smoke
        shell: pwsh
        run: |
          try { ./scripts/native-windows-smoke.ps1 }
          catch {
            $message = ($_.Exception.Message + "`n" + $_.ScriptStackTrace).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Native source smoke failure::$message"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: aem-store-windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Upload diagnostics bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aem-desktop-logs
          path: |
            logs/**
            release/builder-debug.yml
          if-no-files-found: warn

  # Future platforms — kept disabled until Windows is green.
  build-mac:
    runs-on: macos-latest
    if: false
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npm run build

  build-linux:
    runs-on: ubuntu-latest
    if: false
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npm run build
