name: AEM GitHub Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sync all owner repositories into AEM
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APK_STORE_TOKEN }}
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
        run: |
          set -euo pipefail
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/aem-sync-github"             -H "apikey: $SUPABASE_KEY"             -H "Authorization: Bearer $SUPABASE_KEY"             -H "x-github-token: $GH_TOKEN"             -H "Content-Type: application/json"             --data '{"owner":"Emmanuel001afk"}'
          echo
          echo "AEM GitHub discovery completed."
