name: AEM GitHub Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Discover accessible repositories
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APK_STORE_TOKEN }}
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
        run: |
          set -euo pipefail

          page=1
          while :; do
            repos="$(curl -fsS --get https://api.github.com/user/repos \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "visibility=all" \
              --data-urlencode "affiliation=owner,collaborator,organization_member" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=$page")"

            count="$(jq 'length' <<<"$repos")"
            [ "$count" = "0" ] && break

            while IFS= read -r repo_json; do
              full_name="$(jq -r '.full_name' <<<"$repo_json")"
              name="$(jq -r '.name' <<<"$repo_json")"
              html_url="$(jq -r '.html_url' <<<"$repo_json")"
              description="$(jq -r '.description // ""' <<<"$repo_json")"
              language="$(jq -r '.language // ""' <<<"$repo_json")"

              case "$language" in
                Kotlin|Java) ;;
                *) continue ;;
              esac

              contents="$(curl -fsS \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$full_name/contents/")"

              if ! jq -e 'any(.[]?; .name == "gradlew" or .name == "settings.gradle" or .name == "settings.gradle.kts" or .name == "build.gradle" or .name == "build.gradle.kts")' <<<"$contents" >/dev/null; then
                continue
              fi

              encoded_project="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["PROJECT"],safe=""))' PROJECT="$full_name")"
              existing="$(curl -fsS "$SUPABASE_URL/rest/v1/applications?select=id&provider=eq.github&project=eq.$encoded_project" \
                -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")"
              app_id="$(jq -r '.[0].id // empty' <<<"$existing")"

              if [ -z "$app_id" ]; then
                payload="$(jq -nc \
                  --arg p "$full_name" --arg n "$name" --arg d "$description" --arg u "$html_url" \
                  '{provider:"github",project:$p,name:$n,description:$d,source_url:$u,platforms:["android"],category:"Other"}')"
                curl -fsS -X POST "$SUPABASE_URL/rest/v1/applications" \
                  -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
                  -H "Content-Type: application/json" --data "$payload" >/dev/null
              fi
            done < <(jq -c '.[]' <<<"$repos")

            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done

          echo "GitHub discovery completed."
