name: AEM Android runtime verification
on:
  push:
    branches: [main, arena/32bd333b-aem]
    paths:
      - desktop/runtime/**
      - scripts/verify-android.mjs
      - scripts/build-test-apk.py
      - tests/fixtures/android/**
      - package-lock.json
      - .github/workflows/android-runtime-verification.yml
  workflow_dispatch:
permissions:
  contents: read
  checks: write
concurrency:
  group: aem-android-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-android:
    # This job deliberately fails if CPU acceleration or any real Android operation fails.
    # A software-GPU emulator is still a real VM; -no-accel is not an acceptance fallback.
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Record host virtualization before provisioning
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,VirtualizationFirmwareEnabled,SecondLevelAddressTranslationExtensions | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object HypervisorPresent,TotalPhysicalMemory | Format-List
          $emulator = Join-Path $env:ANDROID_HOME 'emulator/emulator.exe'
          if (Test-Path $emulator) { & $emulator -accel-check }
          exit 0
      - name: Install licensed runtime and verify real Android end to end
        run: node scripts/verify-android.mjs --accept-licenses --headless
        env:
          AEM_RUNTIME_ROOT: ${{ runner.temp }}\aem-runtime-verification
          PYTHON: python
          AEM_PRIVATE_JAVA: "1"
      - name: Upload actual runtime evidence or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-runtime-verification
          path: |
            ${{ runner.temp }}/aem-runtime-verification/verification-report.json
            ${{ runner.temp }}/aem-runtime-verification/android-probe.png
            ${{ runner.temp }}/aem-runtime-verification/aem-runtime-probe.apk
            ${{ runner.temp }}/aem-runtime-verification/runtime-lock.json
            ${{ runner.temp }}/aem-runtime-verification/logs/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish readable verification evidence
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs'); const path = require('node:path');
            const root = path.join(process.env.RUNNER_TEMP, 'aem-runtime-verification');
            const file = path.join(root, 'verification-report.json');
            const raw = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
            let report; try { report = raw ? JSON.parse(raw) : { success: false, error: 'Verifier did not produce a report.' }; } catch (error) { report = { success: false, error: `Report was not valid JSON: ${error.message}`, rawReport: raw.slice(0, 4000) }; }
            const tail = (name) => { const p = path.join(root, name); return fs.existsSync(p) ? `\n\n### ${name}\n\`\`\`\n${fs.readFileSync(p, 'utf8').slice(-6000)}\n\`\`\`` : ''; };
            const summary = `## Real Android runtime verification\n\nResult: **${report.success ? 'PASS' : 'FAIL'}**\n\n${(report.checks || []).map(c => `- ${c.passed ? 'PASS' : 'FAIL'}: ${c.name}`).join('\n')}\n\n\`\`\`json\n${JSON.stringify(report, null, 2).slice(0, 40000)}\n\`\`\`${report.success ? '' : tail('logs/android-runtime.log') + tail('logs/emulator.log') + tail('logs/adb.log') + tail('runtime-lock.json')}\n\n### Runtime files\n\`\`\`\n${fs.existsSync(root) ? fs.readdirSync(root, { recursive: true }).slice(0, 200).join('\n') : 'missing root'}\n\`\`\``;
            await github.rest.checks.create({ owner: context.repo.owner, repo: context.repo.repo, name: 'Android runtime evidence', head_sha: context.sha, status: 'completed', conclusion: report.success ? 'success' : 'failure', output: { title: report.success ? 'Android boot, APK, permissions, network and storage passed' : 'Android runtime verification failed', summary: summary.slice(0, 65000) } });
