name: AEM Store Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - run: npx vite build --config vite.mobile.config.ts
      - run: npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
      - run: npx --yes @capacitor/cli@7 add android
      - run: mkdir -p android/app/src/main/java/com/aem/store
      - run: cp native/AemInstallerPlugin.java android/app/src/main/java/com/aem/store/AemInstallerPlugin.java
      - run: cp native/MainActivity.java android/app/src/main/java/com/aem/store/MainActivity.java
      - run: python3 native/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
      - run: npx --yes @capacitor/cli@7 copy android
      - working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish AEM APK to Supabase catalog
        env:
          SUPABASE_URL: https://wfvvmyixqcwosmuldxoq.supabase.co
          SUPABASE_KEY: sb_publishable_Imgtr_W_Z868cBsNEcWpeg_89FE2Mvb
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name aapt | sort -V | tail -n 1)"
          badging="$("$AAPT" dump badging "$APK" | head -n 1)"
          package="$(sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging")"
          filename="$(basename "$APK")"; size="$(stat -c%s "$APK")"; sha="$(sha256sum "$APK" | cut -d' ' -f1)"
          app="$(curl -fsS "$SUPABASE_URL/rest/v1/applications?select=id&provider=eq.github&project=eq.Emmanuel001afk%2FAEM" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")"
          app_id="$(jq -r '.[0].id' <<<"$app")"
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/applications?id=eq.$app_id" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" --data "$(jq -nc --arg pkg "$package" '{package_identity:$pkg,platforms:["android","web"]}')"
          release_json="$(curl -fsS -X POST "$SUPABASE_URL/rest/v1/releases" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" -H "Prefer: return=representation" --data "$(jq -nc --argjson aid "$app_id" --arg sid "aem-store-run-$GITHUB_RUN_ID" --arg vn "$version_name" --argjson vc "$version_code" '{application_id:$aid,source_release_id:$sid,version_name:$vn,version_code:$vc,channel:"development",status:"published",title:"AEM Store APK",published_at:(now|todate)}')")"
          release_id="$(jq -r '.[0].id' <<<"$release_json")"
          path="Emmanuel001afk/AEM/$version_name/$filename"
          curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/aem-artifacts/$path" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/vnd.android.package-archive" -H "x-upsert: true" --data-binary @"$APK" >/dev/null
          public_url="$SUPABASE_URL/storage/v1/object/public/aem-artifacts/$path"
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/artifacts" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" --data "$(jq -nc --argjson rid "$release_id" --arg url "$public_url" --arg fn "$filename" --arg sha "$sha" --arg pkg "$package" --argjson size "$size" --argjson vc "$version_code" '{release_id:$rid,platform:"android",kind:"apk",filename:$fn,download_url:$url,size_bytes:$size,sha256:$sha,package_identity:$pkg,version_code:$vc}')"
      - uses: actions/upload-artifact@v4
        with:
          name: aem-store-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
