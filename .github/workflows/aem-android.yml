name: AEM Store Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm install

      - name: Build web baseline for Android
        run: npx vite build --config vite.mobile.config.ts

      - name: Verify web baseline
        run: |
          test -d mobile-dist
          test -f mobile-dist/index.html
          test -d mobile-dist/assets

      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7

      - name: Generate Android APK layer
        run: npx cap add android

      - name: Copy web baseline into APK layer
        run: npx cap copy android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aem-store-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
